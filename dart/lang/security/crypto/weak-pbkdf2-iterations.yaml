rules:
- id: weak-pbkdf2-iterations
  message: >-
    Detected `Pbkdf2Parameters` configured with fewer than 100 000
    iterations. Low iteration counts make brute-forcing the password
    cheap on modern hardware: a single GPU can compute hundreds of
    millions of PBKDF2-SHA256 candidates per second. OWASP 2023
    recommends at least 600 000 iterations for PBKDF2-SHA256, or use a
    memory-hard KDF such as Argon2 or scrypt instead.
  languages: [dart]
  severity: WARNING
  metadata:
    owasp:
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    cwe:
    - 'CWE-916: Use of Password Hash With Insufficient Computational Effort'
    masvs:
    - 'MSTG-CRYPTO-3: The app uses cryptographic primitives that are appropriate for the particular use-case, configured with parameters that adhere to industry best practices.'
    category: security
    technology:
    - dart
    - flutter
    - pointycastle
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html#pbkdf2
    - https://pub.dev/packages/pointycastle
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
  patterns:
  - pattern: Pbkdf2Parameters($SALT, $ITER, ...)
  - metavariable-comparison:
      metavariable: $ITER
      comparison: $ITER < 100000
