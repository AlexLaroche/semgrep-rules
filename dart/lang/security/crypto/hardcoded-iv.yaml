rules:
- id: hardcoded-iv
  message: >-
    Detected `ParametersWithIV` constructed with an IV that is either
    an all-zero `Uint8List($N)` or a literal `Uint8List.fromList([…])`.
    Reusing the same IV with CBC, CFB, OFB, or CTR breaks confidentiality
    (identical plaintexts produce identical ciphertexts and the keystream
    repeats), and can leak the plaintext entirely. Generate a fresh IV
    per message with `FortunaRandom().nextBytes(blockSizeBytes)` or
    `Random.secure()`.
  languages: [dart]
  severity: ERROR
  metadata:
    owasp:
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    cwe:
    - 'CWE-329: Generation of Predictable IV with CBC Mode'
    - 'CWE-330: Use of Insufficiently Random Values'
    masvs:
    - 'MSTG-CRYPTO-3: The app uses cryptographic primitives that are appropriate for the particular use-case, configured with parameters that adhere to industry best practices.'
    category: security
    technology:
    - dart
    - flutter
    - pointycastle
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    - https://pub.dev/packages/pointycastle
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  patterns:
  - pattern: ParametersWithIV($K, $IV)
  - metavariable-pattern:
      metavariable: $IV
      patterns:
      - pattern-either:
        - pattern: Uint8List($_)
        - pattern: Uint8List.fromList([...])
