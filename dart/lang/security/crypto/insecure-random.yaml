rules:
- id: insecure-random
  message: >-
    `Random()` from `dart:math` is a pseudo-random generator and is **not**
    cryptographically secure. Output is predictable when the seed is known
    or guessable, so it must not be used for security-sensitive values
    (tokens, IDs, IVs, keys, password reset codes). Use `Random.secure()`
    from `dart:math`, which is backed by the platform's CSPRNG, or
    `FortunaRandom` from `package:pointycastle/random`.
  languages: [dart]
  severity: WARNING
  metadata:
    owasp:
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    cwe:
    - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    masvs:
    - 'MSTG-CRYPTO-6: All random values are generated using a sufficiently secure random number generator.'
    category: security
    technology:
    - dart
    - flutter
    references:
    - https://api.dart.dev/stable/dart-math/Random-class.html
    - https://api.dart.dev/stable/dart-math/Random/Random.secure.html
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
  patterns:
  - pattern: Random(...)
  - pattern-not: Random.secure(...)
