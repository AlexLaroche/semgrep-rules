rules:
- id: use-of-md5
  message: >-
    Detected MD5 hash algorithm which is considered insecure. MD5 is not
    collision resistant and is therefore not suitable as a cryptographic
    signature. Use SHA-256 or SHA-3 instead.
  languages: [dart]
  severity: WARNING
  metadata:
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    cwe:
    - 'CWE-328: Use of Weak Hash'
    masvs:
    - 'MSTG-CRYPTO-4: The app does not use cryptographic protocols or algorithms that are widely considered deprecated for security purposes.'
    category: security
    technology:
    - dart
    - flutter
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    - https://pub.dev/packages/pointycastle
    - https://pub.dev/packages/crypto
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
  pattern-either:
  # package:pointycastle/export.dart — Digest factory with algorithm string
  - patterns:
    - pattern: Digest($ALGO)
    - metavariable-regex:
        metavariable: $ALGO
        regex: (?i)^['\"]MD5['\"]$
  # package:pointycastle — algorithm-specific class
  - pattern: MD5Digest()
  # package:crypto/crypto.dart — top-level md5 hasher (with or without
  # an import alias)
  - pattern: md5.convert(...)
  - pattern: $X.md5.convert(...)
