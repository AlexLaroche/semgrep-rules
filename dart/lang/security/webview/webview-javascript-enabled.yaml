rules:
- id: webview-javascript-enabled
  mode: taint
  message: >-
    Detected untrusted input flowing into a `webview_flutter` load
    method. Loading attacker-controlled URLs or HTML in a WebView with
    JavaScript enabled (the typical Flutter default for non-trivial
    apps) lets the attacker run JavaScript inside the app's WebView
    context — including against any registered JavaScript channels and
    bridges back to the host app. Disable JavaScript when not strictly
    needed, restrict the WebView to an allow-listed origin, or escape
    HTML before passing it to `loadHtmlString`.
  languages: [dart]
  severity: ERROR
  metadata:
    owasp:
    - A03:2021 - Injection
    - A03:2025 - Injection
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site Scripting'')'
    - 'CWE-749: Exposed Dangerous Method or Function'
    masvs:
    - 'MSTG-PLATFORM-5: JavaScript is disabled in WebViews unless explicitly required.'
    - 'MSTG-PLATFORM-6: The WebView is configured to allow only the minimum set of protocol handlers required (ideally, only https is supported).'
    category: security
    technology:
    - dart
    - flutter
    - webview
    references:
    - https://pub.dev/packages/webview_flutter
    - https://owasp.org/www-community/attacks/xss/
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $RT $F(..., $T $P, ...) { ... }
      - pattern-inside: |
          $RT $F(..., $T $P, ...) async { ... }
    - focus-metavariable: $P
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $C.loadRequest($URL, ...)
      - pattern: $C.loadHtmlString($HTML, ...)
      - pattern: $C.loadFile($PATH, ...)
