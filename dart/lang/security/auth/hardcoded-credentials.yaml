rules:
- id: hardcoded-credentials
  message: >-
    Detected a credential-looking variable (api key, password, secret,
    token, …) initialised to a non-trivial string literal. Hardcoding
    credentials in source code lets anyone with read access to the
    repository — current contributors, ex-employees, anyone who finds
    the binary on a discarded device — recover them. Load secrets from
    environment variables, a secrets manager, or `flutter_secure_storage`
    at runtime instead.
  languages: [dart]
  severity: WARNING
  metadata:
    owasp:
    - A02:2017 - Broken Authentication
    - A07:2021 - Identification and Authentication Failures
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    masvs:
    - 'MSTG-CODE-3: Free security features offered by the toolchain, such as byte-code minification, stack protection, PIE support and automatic reference counting, are activated.'
    category: security
    technology:
    - dart
    - flutter
    references:
    - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    - https://pub.dev/packages/flutter_secure_storage
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: var $NAME = $VAL;
    - pattern: final $NAME = $VAL;
    - pattern: const $NAME = $VAL;
    - pattern: String $NAME = $VAL;
  - metavariable-regex:
      metavariable: $NAME
      regex: (?i)^(api[-_]?key|password|passwd|secret|client[-_]?secret|access[-_]?key|access[-_]?token|private[-_]?key|jwt|bearer[-_]?token)$
  - metavariable-regex:
      metavariable: $VAL
      regex: ^['\"][^'\"]{8,}['\"]$
